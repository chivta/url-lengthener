name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set deployment variables
        id: vars
        run: |
          echo "image_tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          echo "vite_api_url=${{ secrets.VITE_API_BASE_URL_PROD }}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          docker build --target prod \
            -t "$REGISTRY/url-lengthener-api:$IMAGE_TAG" \
            api/
          docker push "$REGISTRY/url-lengthener-api:$IMAGE_TAG"

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
          VITE_API_BASE_URL: ${{ steps.vars.outputs.vite_api_url }}
        run: |
          docker build --target prod \
            --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL" \
            -t "$REGISTRY/url-lengthener-frontend:$IMAGE_TAG" \
            frontend/
          docker push "$REGISTRY/url-lengthener-frontend:$IMAGE_TAG"

      - name: Update image tags in kustomization
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          cd k8s
          if command -v kustomize >/dev/null 2>&1; then
            kustomize edit set image \
              "url-lengthener-api=$REGISTRY/url-lengthener-api:$IMAGE_TAG" \
              "url-lengthener-frontend=$REGISTRY/url-lengthener-frontend:$IMAGE_TAG"
          else
            sed -i \
              -e "/name: url-lengthener-api/{n;n;s|newTag:.*|newTag: $IMAGE_TAG|}" \
              -e "/name: url-lengthener-frontend/{n;n;s|newTag:.*|newTag: $IMAGE_TAG|}" \
              -e "s|newName: .*url-lengthener-api|newName: $REGISTRY/url-lengthener-api|" \
              -e "s|newName: .*url-lengthener-frontend|newName: $REGISTRY/url-lengthener-frontend|" \
              kustomization.yaml
          fi

      - name: Commit and push updated manifest
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          if ! git diff --staged --quiet; then
            git commit -m "deploy: update image tags to $IMAGE_TAG [skip ci]"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
