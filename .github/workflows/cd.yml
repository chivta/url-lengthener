name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build --target prod \
            -t $REGISTRY/url-shortener-api:$SHA \
            api/
          docker push $REGISTRY/url-shortener-api:$SHA

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build --target prod \
            --build-arg VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL_PROD }} \
            -t $REGISTRY/url-shortener-frontend:$SHA \
            frontend/
          docker push $REGISTRY/url-shortener-frontend:$SHA

      - name: Update manifests
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sed -i "s|ECR_REGISTRY/url-shortener-api:IMAGE_TAG|$REGISTRY/url-shortener-api:$SHA|g" \
            manifests/api/deployment.yaml
          sed -i "s|ECR_REGISTRY/url-shortener-frontend:IMAGE_TAG|$REGISTRY/url-shortener-frontend:$SHA|g" \
            manifests/frontend/deployment.yaml

      - name: Commit manifests
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/api/deployment.yaml manifests/frontend/deployment.yaml
          git diff --staged --quiet || git commit -m "deploy: $SHA"
          git push
