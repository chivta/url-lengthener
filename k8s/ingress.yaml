apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: url-lengthener
  namespace: url-lengthener
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - lengthener.example.com
        - api.lengthener.example.com
      secretName: url-lengthener-tls
  rules:
    - host: api.lengthener.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
    - host: lengthener.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
